name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push to the same branch supersedes an in-flight run.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      # No lint step: `next lint` has no ESLint config in this repo, so it
      # prompts for setup and cannot run non-interactively. Add one and
      # reinstate this step when you're ready.

      - name: Unit tests
        run: npm test

      # No DATABASE_URL on purpose: the build must not need a database.
      # lib/db.ts creates its pool on first query rather than at import.
      - name: Build
        run: npm run build
        env:
          AUTH_SECRET: ci-build-placeholder-not-a-real-secret
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        # Debian, not alpine: db:setup creates an ICU collation.
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: task_bucket_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/task_bucket_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/task_bucket_test
      AUTH_SECRET: ci-e2e-placeholder-not-a-real-secret
      AUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Apply schema and compatibility shims
        run: |
          npx drizzle-kit migrate
          npm run db:setup

      # playwright.config.ts starts its own dev server against TEST_DATABASE_URL.
      - name: Run E2E suite
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
